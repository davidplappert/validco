name: ci

# Runs on pull requests and on any branch that is not main. Deliberately has no
# AWS permissions: `cdk synth` needs no credentials when the account and region
# are supplied as context, so a PR is fully validated — including that the
# CloudFormation template still builds — without handing a fork's workflow an
# AWS identity.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    timeout-minutes: 10
    name: backend (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Split so a failure names the layer rather than "tests failed".
        include:
          # Must cover every tests/test_*.py — tests/test_workflows.py enforces
          # it. This job previously ran neither the privacy guard nor the
          # security suite, so a pull request could add either back unnoticed.
          - suite: unit
            paths: >-
              tests/test_physiology.py tests/test_models.py tests/test_health.py
              tests/test_container.py tests/test_geocode.py tests/test_http.py
              tests/test_suggest.py
          - suite: integration
            paths: >-
              tests/test_services.py tests/test_api.py tests/test_performance.py
              tests/test_place.py
          - suite: infrastructure
            paths: >-
              tests/test_infra.py tests/test_security.py tests/test_openapi.py
              tests/test_privacy.py tests/test_regions.py
              tests/test_workflows.py
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - run: uv python install 3.13
      - run: uv sync --all-groups

      - name: Tests
        run: uv run pytest ${{ matrix.paths }} --tb=short

  lint:
    timeout-minutes: 8
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv python install 3.13
      - run: uv sync --all-groups
      - name: Ruff check
        run: uv run ruff check api data infra tests builder
      - name: Ruff format
        run: uv run ruff format --check api data infra tests builder

  synth:
    timeout-minutes: 10
    name: cdk synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv python install 3.13
      - run: uv sync --group infra
      - run: npm install -g aws-cdk@2
      - name: Synthesize the CloudFormation template
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: us-east-1
        run: uv run cdk synth --quiet --context envName=dev

  frontend:
    timeout-minutes: 12
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test -- --coverage
      - name: Build the static export
        run: npm run build

      - name: Upload the export for the e2e job
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: web/out
          retention-days: 1

      # Deliberately last. A step failure ends the job, and `e2e` needs this
      # job, so wherever these sit a lint failure skips the browser matrix.
      # Putting them after the build at least means one run reports the type
      # errors, the test failures *and* the lint findings, rather than a
      # formatting nit hiding everything behind it.
      #
      # Blocking here, unlike in deploy.yml: a red pull request blocks a merge,
      # which is the correct amount of pressure, and costs no deployment.
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check

  e2e:
    timeout-minutes: 20
    name: e2e (${{ matrix.name }})
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Three jobs rather than nine. The seven viewport projects each run
        # only the responsive spec and take seconds, so they share one runner
        # and Playwright parallelises them internally. Nine separate jobs each
        # doing `playwright install --with-deps` meant nine concurrent apt
        # runs, and one of them hung long enough to burn the job timeout.
        include:
          - name: chromium
            args: --project=chromium
          - name: mobile
            args: --project=mobile
          - name: viewports
            args: >-
              --project=phone-small --project=phone
              --project=tablet-portrait --project=tablet-landscape
              --project=laptop --project=desktop --project=desktop-wide
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Reuse the export the frontend job already built rather than rebuilding.
      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: web/out

      # Playwright's browser download is ~150 MB and unchanged between runs.
      # Caching it also lets the install skip apt entirely on a hit, which is
      # where the occasional multi-minute hang came from.
      # Keyed on the Playwright version, NOT on the lockfile hash. The browser
      # binaries depend on Playwright and nothing else, so keying on the whole
      # lockfile meant any unrelated devDependency invalidated them — adding
      # ESLint threw the cache away, all three matrix jobs fell back to
      # `--with-deps`, and three concurrent apt runs blew the step timeout.
      - name: Work out which Playwright to cache
        id: playwright-version
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # apt is the slow, flaky part, and it only runs on a cache miss — but when
      # it does run it has been known to sit on an unreachable mirror for
      # minutes, so it gets room rather than failing the whole deploy.
      - name: Install the browser
        timeout-minutes: 10
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: End-to-end tests
        timeout-minutes: 8
        run: npx playwright test ${{ matrix.args }}

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.name }}
          path: web/playwright-report
          retention-days: 7
