name: deploy

# The only path to AWS. Pushes to main deploy the dev environment; there is no
# other environment and no way to deploy from a laptop, because the deploy role
# trusts this repository's OIDC identity on this branch and nothing else.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      log_level:
        description: Lambda log level for this deployment
        required: false
        default: DEBUG
        type: choice
        options: [DEBUG, INFO, WARNING]

# One deploy at a time. Superseded runs are cancelled rather than queued: with
# per-job timeouts in place, a newer commit should win immediately instead of
# waiting out an older deploy that is about to be replaced anyway.
#
# CloudFormation itself is safe here — cancelling the workflow does not abort an
# in-flight stack update, and the next run's `cdk deploy` waits for the stack to
# settle before starting.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  # `write` only so the deploy job can push the README's refreshed URLs back.
  # Nothing else in this workflow writes to the repository.
  contents: write
  id-token: write # required to fetch the OIDC token for AWS

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENV_NAME: dev

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # Every job is bounded. Without this a single hung step holds the deploy
    # concurrency group indefinitely and every later push queues behind it —
    # which is exactly what happened once, for 57 minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check api data infra tests builder

      - name: Format check
        run: uv run ruff format --check api data infra tests builder

      # The whole backend suite, including the infrastructure assertions that
      # pin X-Ray, CloudTrail and log retention.
      - name: Backend tests
        run: uv run pytest --tb=short

  test-web:
    name: test web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        timeout-minutes: 8
        run: npx playwright test --project=chromium

      # Hand the built export to the deploy job rather than building it twice.
      - name: Upload the static export
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: web/out
          retention-days: 1

  deploy:
    name: deploy dev
    needs: [test, test-web]
    runs-on: ubuntu-latest
    # CloudFront distribution updates are the long pole and legitimately take
    # several minutes; 30 leaves headroom without allowing an indefinite hang.
    timeout-minutes: 30
    environment:
      name: dev
      url: ${{ steps.outputs.outputs.site_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.13

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: uv sync --group infra

      - name: Install CDK CLI
        run: npm install -g aws-cdk@2

      # Reuse the export the test job already produced. Building it twice cost
      # about ninety seconds and risked the two differing.
      - name: Download the static export
        uses: actions/download-artifact@v4
        with:
          name: web-out
          path: web/out

      # The builder Lambda's native wheels are ~80 MB and identical between
      # runs unless the pinned versions change, so they are cached on the
      # dependency list in bundle.py.
      - name: Cache the builder dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: builder-deps-${{ hashFiles('infra/bundle.py') }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Verify identity
        run: aws sts get-caller-identity

      - name: CDK diff
        timeout-minutes: 5
        continue-on-error: true # informational; a first deploy has nothing to diff against
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
        run: |
          uv run cdk diff \
            --context envName=$ENV_NAME \
            --context appVersion=${{ github.sha }} \
            --context logLevel=${{ inputs.log_level || 'DEBUG' }}

      - name: CDK deploy
        timeout-minutes: 20
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
        run: |
          uv run cdk deploy \
            --require-approval never \
            --context envName=$ENV_NAME \
            --context appVersion=${{ github.sha }} \
            --context logLevel=${{ inputs.log_level || 'DEBUG' }} \
            --outputs-file cdk-outputs.json

      - name: Read stack outputs
        id: outputs
        run: |
          SITE=$(jq -r '."stepwise-dev".SiteUrl' cdk-outputs.json)
          API=$(jq -r '."stepwise-dev".ApiUrl' cdk-outputs.json)
          echo "site_url=$SITE" >> "$GITHUB_OUTPUT"
          echo "api_url=$API" >> "$GITHUB_OUTPUT"

      # A deploy that reports success while the API 500s is worse than a failed
      # deploy, so the workflow exercises the real endpoints before going green.
      - name: Smoke test
        timeout-minutes: 5
        env:
          API: ${{ steps.outputs.outputs.api_url }}
          SITE: ${{ steps.outputs.outputs.site_url }}
        run: |
          set -euo pipefail
          echo "Waiting for the API to become reachable..."
          for i in $(seq 1 20); do
            if curl -fsS --max-time 15 "$API/v1/health" > /tmp/health.json; then break; fi
            echo "  attempt $i failed, retrying"; sleep 6
          done
          jq -e '.ok == true' /tmp/health.json > /dev/null
          echo "health OK"

          curl -fsS --max-time 20 "$API/v1/regions" | jq -e '.regions | length >= 1' > /dev/null
          echo "regions OK"

          # The real product path: a full plan request end to end.
          curl -fsS --max-time 30 -X POST "$API/v1/plan" \
            -H 'content-type: application/json' \
            -d '{"address":"100 N Main St, Morton, IL 61550",
                 "minutes":30,
                 "profile":{"sex":"male","age":45,"weight_lb":320,"height_ft":6},
                 "preferences":{"prefer_paths":true}}' > /tmp/plan.json
          jq -e '.routes | length >= 1' /tmp/plan.json > /dev/null
          echo "plan OK — $(jq -r '.routes | length' /tmp/plan.json) routes"

          curl -fsS -o /dev/null -w 'site HTTP %{http_code}\n' --max-time 20 "$SITE/"

      # The same end-to-end suite the CI job runs against a local export, now
      # pointed at the real CloudFront distribution and the real API. This is
      # what proves the deployment works, not just that it succeeded.
      - name: End-to-end against the deployment
        timeout-minutes: 8
        working-directory: web
        env:
          E2E_BASE_URL: ${{ steps.outputs.outputs.site_url }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium tests/e2e/deployed.spec.ts

      - name: Upload the e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-deployed
          path: web/playwright-report
          retention-days: 7

      # Keep the README's live links accurate without anyone remembering to.
      # The deploy trigger ignores "**/*.md", so this commit cannot start
      # another deploy — but [skip ci] is added as a second belt.
      - name: Update the README with the deployed URLs
        if: success()
        env:
          SITE: ${{ steps.outputs.outputs.site_url }}
          API: ${{ steps.outputs.outputs.api_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re

          site, api = os.environ["SITE"], os.environ["API"]
          block = "\n".join([
              "<!-- deploy:urls:start -->",
              "| | |",
              "|---|---|",
              f"| **Web app** | <{site}> |",
              f"| **API** | <{api}> |",
              f"| **Health check** | <{api}/v1/health> |",
              "| **API reference** | [`openapi.yaml`](openapi.yaml) — OpenAPI 3.1 |",
              "<!-- deploy:urls:end -->",
          ])
          path = pathlib.Path("README.md")
          text = path.read_text()
          updated = re.sub(
              r"<!-- deploy:urls:start -->.*?<!-- deploy:urls:end -->",
              block, text, flags=re.S,
          )
          path.write_text(updated)
          print("changed" if updated != text else "unchanged")
          PY

          if git diff --quiet README.md; then
            echo "README already current"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh deployed URLs [skip ci]"
          git push origin HEAD:main

      - name: Job summary
        if: always()
        env:
          SITE: ${{ steps.outputs.outputs.site_url }}
          API: ${{ steps.outputs.outputs.api_url }}
        run: |
          {
            echo "## StepWise — dev deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Web app | ${SITE:-n/a} |"
            echo "| API | ${API:-n/a} |"
            echo "| Health | ${API:-n/a}/v1/health |"
            echo "| Commit | \`${GITHUB_SHA::8}\` |"
            if [ -f /tmp/plan.json ]; then
              echo ""
              echo "### Smoke test — top route"
              echo '```json'
              jq '{distance_mi: .routes[0].effort.distance_mi,
                   duration_min: .routes[0].effort.duration_min,
                   kcal: .routes[0].effort.kcal_gross,
                   steps: .routes[0].effort.steps,
                   fit: .routes[0].suitability.score}' /tmp/plan.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
