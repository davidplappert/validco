name: deploy

# The only path to AWS. Pushes to main deploy the dev environment; there is no
# other environment and no way to deploy from a laptop, because the deploy role
# trusts this repository's OIDC identity on this branch and nothing else.
#
# The job graph is deliberately wide — everything that can run concurrently
# does, so the critical path is build, verify, deploy, verify the deployment:
#
#   lint ─────────────┐
#   test (x3 suites) ─┼─> deploy ─> verify
#   web ─> web-e2e ───┘
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      log_level:
        description: Lambda log level for this deployment
        required: false
        default: DEBUG
        type: choice
        options: [DEBUG, INFO, WARNING]

# One deploy at a time. Superseded runs are cancelled rather than queued: with
# per-job timeouts in place a newer commit should win immediately instead of
# waiting out an older deploy that is about to be replaced anyway.
#
# CloudFormation is safe here — cancelling the workflow does not abort an
# in-flight stack update, and the next run's `cdk deploy` waits for the stack
# to settle before starting.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  # `write` only so the deploy job can push the README's refreshed URLs back.
  contents: write
  id-token: write # required to fetch the OIDC token for AWS

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENV_NAME: dev
  STACK: stepwise-dev

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv python install 3.13
      - run: uv sync --all-groups
      - run: uv run ruff check api data infra tests builder
      - run: uv run ruff format --check api data infra tests builder

  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Split across runners so the slowest suite sets the pace rather than
        # their sum, and so a failure names the layer that broke.
        include:
          # tests/test_workflows.py fails if a test file is missing from this
          # list, in either workflow. Three files were silently unrun before it
          # existed, and enumeration is otherwise a trap that springs quietly.
          - suite: unit
            paths: >-
              tests/test_physiology.py tests/test_models.py tests/test_health.py
              tests/test_container.py tests/test_geocode.py tests/test_http.py
              tests/test_suggest.py
          - suite: integration
            paths: >-
              tests/test_services.py tests/test_api.py tests/test_performance.py
              tests/test_place.py
          - suite: infra-security
            paths: >-
              tests/test_infra.py tests/test_security.py tests/test_openapi.py
              tests/test_privacy.py tests/test_regions.py
              tests/test_workflows.py
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv python install 3.13
      - run: uv sync --all-groups
      - name: Tests
        run: uv run pytest ${{ matrix.paths }} --tb=short

  web:
    name: web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Build the static export
        run: npm run build
      # Built once and reused by the e2e and deploy jobs, so three runners
      # never build the same bundle three times.
      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: web/out
          retention-days: 1

  web-e2e:
    name: web e2e (${{ matrix.name }})
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Three jobs rather than nine. The seven viewport projects each run
        # only the responsive spec and take seconds, so they share one runner
        # and Playwright parallelises them internally. Nine separate jobs each
        # doing `playwright install --with-deps` meant nine concurrent apt
        # runs, and one of them hung long enough to burn the job timeout.
        include:
          - name: chromium
            args: --project=chromium
          - name: mobile
            args: --project=mobile
          - name: viewports
            args: >-
              --project=phone-small --project=phone
              --project=tablet-portrait --project=tablet-landscape
              --project=laptop --project=desktop --project=desktop-wide
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: web/out
      # Playwright's browser download is ~150 MB and unchanged between runs.
      # Caching it also lets the install skip apt entirely on a hit, which is
      # where the occasional multi-minute hang came from.
      - name: Cache the Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install the browser
        timeout-minutes: 6
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: End-to-end tests
        timeout-minutes: 8
        run: npx playwright test ${{ matrix.args }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.name }}
          path: web/playwright-report
          retention-days: 7

  deploy:
    name: deploy dev
    needs: [lint, test, web-e2e]
    runs-on: ubuntu-latest
    # CloudFront distribution updates are the long pole and legitimately take
    # several minutes; 30 leaves headroom without allowing an indefinite hang.
    timeout-minutes: 30
    environment:
      name: dev
      url: ${{ steps.outputs.outputs.site_url }}
    outputs:
      site_url: ${{ steps.outputs.outputs.site_url }}
      api_url: ${{ steps.outputs.outputs.api_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv python install 3.13
      - run: uv sync --group infra
      - name: Install CDK CLI
        run: npm install -g aws-cdk@2

      # Reuse the export the web job already produced. Building it twice cost
      # about ninety seconds and risked the two differing.
      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: web/out

      # The builder Lambda's native wheels are ~80 MB and identical between
      # runs unless the pinned versions or the bundled sources change.
      - name: Cache the builder bundle
        uses: actions/cache@v4
        with:
          path: cdk.out/builder-bundle
          key: builder-${{ hashFiles('infra/bundle.py', 'builder/**', 'data/pipeline/**', 'api/stepwise/**') }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Verify identity
        run: aws sts get-caller-identity

      # Configuration lives in SSM as SecureString and is resolved here, at
      # deploy time, so the Lambda reads plain environment variables rather
      # than calling SSM on every cold start. No parameters is the normal case:
      # this application has no secrets.
      - name: Resolve configuration from SSM
        run: |
          set -euo pipefail
          json=$(aws ssm get-parameters-by-path \
                   --path "/stepwise/${ENV_NAME}" --recursive --with-decryption \
                   --query 'Parameters[].{name:Name,value:Value}' \
                   --output json 2>/dev/null || echo '[]')
          # Written to a file rather than a step output, so a value can never
          # appear in the run log.
          echo "$json" | jq -c '
            map({ (.name | split("/") | last | ascii_upcase | gsub("-";"_")): .value })
            | add // {}' > /tmp/parameters.json
          echo "resolved $(jq 'length' /tmp/parameters.json) parameter(s) from SSM"

      - name: CDK diff
        timeout-minutes: 6
        continue-on-error: true # informational; a first deploy has nothing to diff against
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
        run: |
          uv run cdk diff \
            --context envName=$ENV_NAME \
            --context appVersion=${{ github.sha }} \
            --context logLevel=${{ inputs.log_level || 'DEBUG' }} \
            --context parameters="$(cat /tmp/parameters.json)"

      - name: CDK deploy
        timeout-minutes: 20
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
        run: |
          uv run cdk deploy \
            --require-approval never \
            --context envName=$ENV_NAME \
            --context appVersion=${{ github.sha }} \
            --context logLevel=${{ inputs.log_level || 'DEBUG' }} \
            --context parameters="$(cat /tmp/parameters.json)" \
            --outputs-file cdk-outputs.json

      - name: Read stack outputs
        id: outputs
        run: |
          SITE=$(jq -r --arg s "$STACK" '.[$s].SiteUrl' cdk-outputs.json)
          API=$(jq -r --arg s "$STACK" '.[$s].ApiUrl' cdk-outputs.json)
          echo "site_url=$SITE" >> "$GITHUB_OUTPUT"
          echo "api_url=$API" >> "$GITHUB_OUTPUT"

      # A deploy that reports success while the API 500s is worse than a failed
      # deploy, so the real endpoints are exercised before this goes green.
      - name: Smoke test
        timeout-minutes: 5
        env:
          API: ${{ steps.outputs.outputs.api_url }}
          SITE: ${{ steps.outputs.outputs.site_url }}
        run: |
          set -euo pipefail
          echo "Waiting for the API to become reachable..."
          for i in $(seq 1 20); do
            if curl -fsS --max-time 15 "$API/v1/health" > /tmp/health.json; then break; fi
            echo "  attempt $i failed, retrying"; sleep 6
          done
          jq -e '.ok == true' /tmp/health.json > /dev/null
          echo "health OK"

          curl -fsS --max-time 20 "$API/v1/regions" | jq -e '.regions | length >= 1' > /dev/null
          echo "regions OK"

          curl -fsS --max-time 30 -X POST "$API/v1/plan" \
            -H 'content-type: application/json' \
            -d '{"address":"100 N Main St, Morton, IL 61550",
                 "minutes":30,
                 "profile":{"sex":"male","age":45,"weight_lb":320,"height_ft":6},
                 "preferences":{"prefer_paths":true}}' > /tmp/plan.json
          jq -e '.routes | length >= 1' /tmp/plan.json > /dev/null
          echo "plan OK — $(jq -r '.routes | length' /tmp/plan.json) routes"

          curl -fsS -o /dev/null -w 'site HTTP %{http_code}\n' --max-time 20 "$SITE/"

      # Keep the README's live links accurate without anyone remembering to.
      # The deploy trigger ignores "**/*.md" so this cannot start another
      # deploy; [skip ci] is a second belt.
      - name: Update the README with the deployed URLs
        if: success()
        env:
          SITE: ${{ steps.outputs.outputs.site_url }}
          API: ${{ steps.outputs.outputs.api_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re

          site, api = os.environ["SITE"], os.environ["API"]
          block = "\n".join([
              "<!-- deploy:urls:start -->",
              "| | |",
              "|---|---|",
              f"| **Web app** | <{site}> |",
              f"| **API** | <{api}> |",
              f"| **Health check** | <{api}/v1/health> |",
              "| **API reference** | [`openapi.yaml`](openapi.yaml) — OpenAPI 3.1 |",
              "<!-- deploy:urls:end -->",
          ])
          path = pathlib.Path("README.md")
          path.write_text(re.sub(
              r"<!-- deploy:urls:start -->.*?<!-- deploy:urls:end -->",
              block, path.read_text(), flags=re.S,
          ))
          PY

          if git diff --quiet README.md; then
            echo "README already current"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh deployed URLs [skip ci]"
          git push origin HEAD:main

  verify:
    name: verify deployment
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # This job needs its own dependencies. `npx playwright test` cannot load a
      # config that imports @playwright/test unless the package is installed,
      # and omitting this once turned a healthy deploy into a red run.
      - run: npm ci
      # Playwright's browser download is ~150 MB and unchanged between runs.
      # Caching it also lets the install skip apt entirely on a hit, which is
      # where the occasional multi-minute hang came from.
      - name: Cache the Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install the browser
        timeout-minutes: 6
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      # The un-stubbed suite: real CloudFront, real config.json, real API
      # Gateway, real Lambda cold start. This is what proves the deployment
      # works rather than merely that CloudFormation succeeded.
      - name: End-to-end against the deployment
        timeout-minutes: 8
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.site_url }}
        run: npx playwright test --project=chromium tests/e2e/deployed.spec.ts

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-deployed
          path: web/playwright-report
          retention-days: 7

      - name: Job summary
        if: always()
        env:
          SITE: ${{ needs.deploy.outputs.site_url }}
          API: ${{ needs.deploy.outputs.api_url }}
        run: |
          {
            echo "## StepWise — dev deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Web app | ${SITE:-n/a} |"
            echo "| API | ${API:-n/a} |"
            echo "| Health | ${API:-n/a}/v1/health |"
            echo "| Commit | \`${GITHUB_SHA::8}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
