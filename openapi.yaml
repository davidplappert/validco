openapi: 3.1.0

info:
  title: StepWise API
  version: "1.0.0"
  summary: Walking routes scored for your body, built on Overture Maps open data.
  description: |
    StepWise turns a person and a time budget into walking routes, each scored for
    that specific body: real elevation from a DEM, an honest duration, calories,
    steps, and how much of the walk is on a footpath rather than in the roadway.

    ## What makes it different

    Most walking apps answer "how do I get from A to B". This one answers "I have
    forty minutes, where should I walk" — the destination is an *output*, and the
    route comes back to where it started.

    ## Data

    Everything comes from open data, baked into the deployment package at build
    time. There is no database and no runtime dependency on a third party:

    * **Overture Maps** (`transportation`) — the walking network, split at its
      connectors into a routable graph.
    * **Overture Maps** (`addresses`) — the geocoder's entire corpus. Your home
      address is never sent to a third-party geocoding service.
    * **Overture Maps** (`places`, `base/land_use`) — destinations worth walking
      to, and green space.
    * **USGS 3DEP** via AWS Terrain Tiles — elevation at every graph node.

    ## The health model

    Energy uses the gradient cost-of-transport curve from Minetti et al. (2002),
    which — unlike the far more common ACSM walking equation — is defined for
    *descent* as well as ascent. Resting metabolism is estimated separately with
    Mifflin-St Jeor, which is validated across BMI classes; ACSM's flat
    3.5 mL/kg/min term scales resting metabolism linearly with total mass and is
    documented to overestimate expenditure substantially in people with obesity.

    Every response carries its own caveats. Nothing here is medical advice.

    ## Limits

    Two regions are covered: San Francisco, CA and Peoria/Morton, IL.
    Requests outside them return `422` naming the covered areas.

  contact:
    name: David Plappert
    url: https://github.com/davidplappert/validco
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://{restApiId}.execute-api.{region}.amazonaws.com/{stage}
    description: AWS API Gateway REST API
    variables:
      restApiId:
        default: replace-me
        description: The REST API id from the CDK stack output `ApiUrl`.
      region:
        default: us-east-1
      stage:
        default: dev

tags:
  - name: system
    description: Liveness and coverage.
  - name: geocoding
    description: Resolving addresses against the Overture address corpus.
  - name: coverage
    description: >
      Which areas are available, and requesting new ones. Any place in Overture
      can be added on demand; the first request pays for a one-off extraction
      and the result is cached for everyone.
  - name: planning
    description: The product — turning a person and a time budget into walks.

paths:
  /:
    get:
      tags: [system]
      operationId: getRoot
      summary: Redirect to the browser app
      description: |
        The API's base URL is the address most likely to be pasted somewhere by
        hand, and it used to answer with a 404 — well formed, listing every
        route, and still reading as "this is broken" to anyone who opened it.

        A browser is redirected to the app. Anything that does not follow
        redirects still receives a JSON document naming the app and the API
        root, so `curl` without `-L` shows something useful rather than a blank
        page.

        The redirect is temporary (302) on purpose: the target is a CloudFront
        domain that is regenerated whenever the distribution is replaced, and a
        301 would be cached by browsers indefinitely.
      responses:
        "302":
          description: The browser app's location.
          headers:
            Location:
              description: Absolute URL of the browser app.
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string, example: stepwise }
                  app: { type: string, format: uri }
                  api: { type: string, example: /v1 }
                  health: { type: string, example: /v1/health }
                  message: { type: string }
        "200":
          description: |
            No browser app is configured for this deployment — local
            development, typically. Describes the API instead of redirecting.
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string }
                  api: { type: string }
                  health: { type: string }
                  message: { type: string }

  /v1/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness, plus which datasets are resident
      description: |
        Also reports which region datasets this Lambda container has decoded.
        That makes cold-start behaviour observable rather than something to infer
        from a latency graph.
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/regions:
    get:
      tags: [system]
      operationId: listRegions
      summary: The covered areas and their dataset sizes
      responses:
        "200":
          description: Every region the deployment can plan walks in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionsResponse"

    post:
      tags: [coverage]
      operationId: requestRegion
      summary: Ask for coverage of somewhere new
      description: |
        Requests that a new area be extracted from Overture. Returns immediately
        with a key to poll — the extraction itself takes a minute or two and
        runs in a separate function.

        Idempotent: asking twice for the same place returns the same key and
        joins the in-flight build rather than starting a second one. That
        guarantee comes from a conditional write in the artifact store, so it
        holds even for simultaneous requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                place:
                  type: string
                  maxLength: 120
                  description: A town or city name, optionally qualified by state.
                  examples: ["Austin, TX", "Boulder, Colorado", "Morton IL"]
                lat: { type: number, minimum: -90, maximum: 90 }
                lon: { type: number, minimum: -180, maximum: 180 }
              anyOf:
                - required: [place]
                - required: [lat, lon]
      responses:
        "200":
          description: The area is already covered and ready to use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionState"
        "202":
          description: A build has started, or one was already running.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RegionState"
                  - type: object
                    properties:
                      poll:
                        type: string
                        description: Path to poll for progress.
                        example: /v1/regions/us-tx-austin
                      existing:
                        type: boolean
                        description: Whether this joined a build already in flight.
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: This deployment serves only its bundled regions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/geocode:
    get:
      tags: [geocoding]
      operationId: geocode
      summary: Resolve free text to a coordinate
      description: |
        Accepts a street address, a street name on its own, or a literal
        `lat, lon` pair.

        The matcher is deliberately forgiving. "100 N Main St" and "100 North
        Main Street" fold to the same key, and a house number missing from the
        corpus falls back to the nearest one on that street — placing you at 706
        when you typed 708 is a far better answer than "not found". The `match`
        field says which of those happened.

        A miss returns `404` with street suggestions rather than a bare failure,
        because the usual cause is a spelling or a missing suffix.
      parameters:
        - name: q
          in: query
          required: true
          description: The address, street, or `lat, lon` pair to resolve.
          schema:
            type: string
            minLength: 1
          examples:
            fullAddress:
              value: 100 N Main St, Morton, IL 61550
            abbreviated:
              value: 1000 California St, San Francisco
            streetOnly:
              value: Market Street
            coordinates:
              value: 37.7749, -122.4194
        - name: region
          in: query
          required: false
          description: Restrict the search to one region. Omit to try each in turn.
          schema:
            $ref: "#/components/schemas/RegionKey"
      responses:
        "200":
          description: The address resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeocodeHit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No match in any region tried.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeocodeMiss"

  /v1/regions/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: The region key, as returned by `POST /v1/regions`.
        schema: { type: string }
    get:
      tags: [coverage]
      operationId: getRegion
      summary: One region's state and build progress
      description: |
        Poll this while a region is building. `progress` runs from 0 to 1 and is
        weighted by how long each stage actually takes, so a progress bar driven
        by it advances at a roughly steady rate.
      responses:
        "200":
          description: The region's current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionState"
        "404":
          description: No such region has been requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [coverage]
      operationId: clearRegion
      summary: Clear a failed build so it can be retried
      description: |
        Only failed or stalled builds may be cleared, and bundled regions never
        can. A successful region is a shared cache entry — letting any caller
        evict it would let one user impose a rebuild on everyone.
      responses:
        "200":
          description: The region was cleared and may be requested again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
                  cleared: { type: boolean }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No such region.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/suggest:
    get:
      tags: [geocoding]
      operationId: suggestAddresses
      summary: Address completions as the user types
      description: |
        Autocomplete served from the same Overture corpus as the geocoder, so
        it costs nothing per keystroke and the user's partial home address
        never leaves this deployment — unlike a commercial places API.

        Forgiving about how much has been typed: `"cali"` returns street names,
        `"1100 cal"` returns concrete addresses at that number on matching
        streets, and `"1100 california"` returns the exact address plus nearby
        house numbers.

        Ranking is by prefix match first, then by how many addresses a street
        has — a stand-in for prominence, so `"cal"` returns California Street
        rather than Calgary Street.

        Always returns 200. A query too short or too long yields an empty list
        rather than an error, because a 4xx mid-word turns every keystroke into
        a UI error.
      parameters:
        - name: q
          in: query
          required: true
          description: The partial address typed so far.
          schema: { type: string }
          examples:
            partialStreet: { value: cali }
            numberAndPartialStreet: { value: 1100 cal }
            fullAddress: { value: 1100 California St }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 10, default: 8 }
        - name: region
          in: query
          required: false
          description: Restrict to one region. Omit to search all of them.
          schema: { $ref: "#/components/schemas/RegionKey" }
      responses:
        "200":
          description: Ranked completions, best first.
          content:
            application/json:
              schema:
                type: object
                required: [query, suggestions]
                properties:
                  query: { type: string }
                  suggestions:
                    type: array
                    maxItems: 10
                    items:
                      type: object
                      required: [kind, label, value, region]
                      properties:
                        kind:
                          type: string
                          enum: [street, address]
                        label:
                          type: string
                          description: What to show in the dropdown.
                          example: 1100 CALIFORNIA ST, 94108
                        value:
                          type: string
                          description: What to put in the input when chosen.
                        region: { $ref: "#/components/schemas/RegionKey" }
                        lat:
                          type: [number, "null"]
                          description: >
                            Present so the client can plan directly from a
                            chosen suggestion without a second geocode.
                        lon: { type: [number, "null"] }
                  attribution: { type: string }

  /v1/places:
    get:
      tags: [planning]
      operationId: listPlaces
      summary: Named destinations near a point
      description: |
        The candidate destinations the planner aims walks at, filtered at build
        time to categories that make a walk worth taking and grouped so the
        reason for a suggestion can be explained.
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radius_m
          in: query
          required: false
          schema: { type: number, minimum: 50, maximum: 5000, default: 1200 }
        - name: region
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RegionKey"
      responses:
        "200":
          description: Destinations within the radius, nearest first.
          content:
            application/json:
              schema:
                type: object
                required: [region, count, places]
                properties:
                  region:
                    $ref: "#/components/schemas/RegionKey"
                  count: { type: integer }
                  places:
                    type: array
                    maxItems: 200
                    items:
                      $ref: "#/components/schemas/Destination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /v1/plan:
    post:
      tags: [planning]
      operationId: planWalk
      summary: Find walks worth taking
      description: |
        Given a walker, a starting point and a time budget, returns a ranked and
        de-duplicated set of loops.

        The search is bounded by *predicted walking time*, not distance, using
        the same physiology that produces the reported duration — so a
        forty-minute request stays a forty-minute walk even on San Francisco's
        hills, where a kilometre uphill is emphatically not a kilometre.

        Start the walk from either `address` or an explicit `lat`/`lon` pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
            examples:
              byAddress:
                summary: A 30-minute flat walk from a home address
                value:
                  address: 100 N Main St, Morton, IL 61550
                  minutes: 30
                  profile:
                    sex: male
                    age: 33
                    weight_lb: 320
                    height_ft: 6
                    height_in: 0
                  preferences:
                    prefer_paths: true
                    avoid_hills: true
              byCoordinates:
                summary: A 45-minute walk from a dropped pin, metric units
                value:
                  lat: 37.7913
                  lon: -122.4089
                  minutes: 45
                  profile:
                    sex: female
                    age: 41
                    weight_kg: 68
                    height_cm: 165
                  preferences:
                    prefer_paths: true
                    avoid_stairs: true
                    prefer_green: true
                  max_routes: 4
      responses:
        "200":
          description: Ranked walks, best first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: The address could not be resolved in any covered region.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"

components:
  responses:
    BadRequest:
      description: |
        The request failed validation. The message names the offending field and
        its accepted range.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            outOfRange:
              value:
                error: minutes must be between 5.0 and 240.0, got 9999.0
                request_id: 8d1f7c6a-9e2b-4a11-b0c1-2f3a4b5c6d7e

    Unprocessable:
      description: |
        Well-formed, but not actionable — a point outside every covered region,
        or a start with no walkable network within 600 m. These are the honest
        limits of the data rather than a caller mistake.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            outsideCoverage:
              value:
                error: those coordinates are outside every covered region
                regions: [sf, pia]
                request_id: 8d1f7c6a-9e2b-4a11-b0c1-2f3a4b5c6d7e

  schemas:
    RegionKey:
      type: string
      enum: [sf, pia]
      description: |
        `sf` — San Francisco, CA. `pia` — Peoria & Morton, IL.

    Error:
      type: object
      description: |
        Errors carry three things at once, for three audiences: a machine
        `code` the client branches on, human `title` and `detail` written to be
        displayed, and a developer `message` in `error` that matches the logs.
        Where recovery is possible, an `action` says what to offer.
      required: [error, code, title, detail]
      properties:
        code:
          type: string
          description: Machine-readable failure kind. Branch on this, not on prose.
          enum:
            - bad_request
            - too_large
            - not_found
            - address_not_found
            - not_ready
            - region_building
            - unprocessable
            - region_not_covered
            - region_build_failed
            - no_walkable_network
            - upstream_unavailable
            - internal_error
        title:
          type: string
          description: A short heading, safe to show a user.
          example: We don't have walking data for that area yet
        detail:
          type: string
          description: A sentence explaining what to do about it.
        action:
          type: object
          description: An offered recovery step.
          required: [kind, label]
          properties:
            kind:
              type: string
              enum: [add_region, retry_region, poll_region]
            label:
              type: string
              description: Button text.
              example: Add this area
            place: { type: string }
            key: { type: string }
            lat: { type: number }
            lon: { type: number }
        error:
          type: string
          description: Developer-facing summary; matches the logs.
        request_id:
          type: string
          description: |
            Correlates with the Lambda's structured logs and its X-Ray trace.
            Quote this when reporting a failure.
        regions:
          type: array
          items: { $ref: "#/components/schemas/RegionKey" }
        suggestions:
          type: object
          additionalProperties: true
          description: Per-region street suggestions, when a geocode missed.

    Health:
      type: object
      required: [ok, service, version]
      properties:
        ok: { type: boolean }
        service: { type: string, const: stepwise }
        version:
          type: string
          description: The git SHA the running Lambda was deployed from.
        env: { type: string, example: dev }
        on_demand_regions:
          type: boolean
          description: Whether this deployment can extract new coverage areas.
        regions_registered:
          type: object
          description: Which datasets this container has decoded so far.
          additionalProperties:
            type: object
            properties:
              graph: { type: boolean }
              addresses: { type: boolean }
              places: { type: boolean }
              green: { type: boolean }

    Region:
      type: object
      required: [key, label, center, bbox]
      properties:
        key: { $ref: "#/components/schemas/RegionKey" }
        label: { type: string, example: San Francisco, CA }
        center:
          type: array
          description: "[latitude, longitude] — where the map opens."
          items: { type: number }
          minItems: 2
          maxItems: 2
        bbox:
          type: array
          description: "[west, south, east, north] in degrees."
          items: { type: number }
          minItems: 4
          maxItems: 4
        n_nodes: { type: integer, example: 82889 }
        n_edges: { type: integer, example: 123055 }
        n_addresses: { type: integer, example: 394704 }
        n_places: { type: integer, example: 3959 }

    RegionState:
      type: object
      description: A coverage area's lifecycle state.
      required: [key, state]
      properties:
        key: { type: string, example: us-tx-austin }
        label: { type: string, example: "Austin, TX" }
        state:
          type: string
          enum: [pending, building, ready, failed]
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: Build progress, weighted by each stage's real cost.
        stage:
          type: string
          description: Which stage is running.
          enum: [queued, resolve, segments, addresses, places, green, graph,
                 terrain, pack, upload, ready]
        message:
          type: string
          description: A sentence describing the current stage, for display.
        bbox:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
        center:
          type: array
          items: { type: number }
          minItems: 2
          maxItems: 2
        stats:
          type: object
          description: What the build produced. Present once ready.
          properties:
            n_nodes: { type: integer }
            n_edges: { type: integer }
            n_addresses: { type: integer }
            n_places: { type: integer }
            bytes: { type: integer }
            build_seconds: { type: number }
        error:
          type: string
          description: Why the build failed. Present only when state is failed.
        updated_at:
          type: number
          description: Unix timestamp of the last status write.

    RegionsResponse:
      type: object
      required: [regions, default, attribution]
      properties:
        regions:
          type: array
          description: Areas ready to serve plans.
          items: { $ref: "#/components/schemas/Region" }
        pending:
          type: array
          description: Areas that have been requested but are not ready yet.
          items: { $ref: "#/components/schemas/RegionState" }
        default: { $ref: "#/components/schemas/RegionKey" }
        on_demand:
          type: boolean
          description: >
            Whether this deployment can extract new areas. False means only the
            bundled regions are available.
        attribution:
          type: string
          description: Required data attribution. Display this.

    GeocodeHit:
      type: object
      required: [found, match, lat, lon, label]
      properties:
        found: { type: boolean, const: true }
        match:
          type: string
          enum: [exact, nearest_number, street_midpoint, coordinates]
          description: |
            How the match was made. `nearest_number` means the exact house
            number is absent from the corpus and the closest one was used.
        lat: { type: number }
        lon: { type: number }
        label: { type: string, example: "100 North MAIN Street, 61550" }
        region: { $ref: "#/components/schemas/RegionKey" }
        address:
          type: object
          properties:
            number: { type: string }
            street: { type: string }
            postcode: { type: string }
            lat: { type: number }
            lon: { type: number }
            exact: { type: boolean }

    GeocodeMiss:
      type: object
      required: [found]
      properties:
        found: { type: boolean, const: false }
        query: { type: string }
        tried:
          type: array
          description: One entry per region searched, each with its suggestions.
          items:
            type: object
            properties:
              found: { type: boolean }
              reason: { type: string }
              region: { $ref: "#/components/schemas/RegionKey" }
              suggestions:
                type: array
                items: { type: string }

    ProfileInput:
      type: object
      description: |
        Weight is required in one unit or the other. Height is optional but
        materially improves resting metabolism and step count; when omitted the
        API substitutes a population mean and sets `height_assumed`.
      required: [sex, age]
      properties:
        sex:
          type: string
          enum: [male, female, m, f, man, woman]
          description: |
            The gait-speed and body-composition norms this model draws on are
            only published split by binary sex. That is a limitation of the
            source literature, not a design choice.
        age:
          type: integer
          minimum: 13
          maximum: 110
        weight_kg: { type: number, minimum: 25, maximum: 400 }
        weight_lb: { type: number, minimum: 55, maximum: 880 }
        height_cm: { type: number, minimum: 120, maximum: 230 }
        height_ft: { type: number, minimum: 3, maximum: 8 }
        height_in: { type: number, minimum: 0, maximum: 11.9 }
      anyOf:
        - required: [weight_kg]
        - required: [weight_lb]

    Preferences:
      type: object
      description: What the walker wants beyond a time budget.
      properties:
        prefer_paths:
          type: boolean
          default: true
          description: Favour footpaths and park trails over the roadway.
        avoid_hills:
          type: boolean
          default: false
          description: Make gradient disproportionately expensive to route over.
        avoid_stairs:
          type: boolean
          default: false
          description: Exclude stepped sections outright. The one hard exclusion.
        avoid_busy_roads:
          type: boolean
          default: true
        prefer_green:
          type: boolean
          default: false
          description: Favour routes passing near parks and gardens.

    PlanRequest:
      type: object
      required: [profile]
      properties:
        address:
          type: string
          description: Free-text start address. Required unless lat/lon are given.
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        region:
          $ref: "#/components/schemas/RegionKey"
        minutes:
          type: number
          minimum: 5
          maximum: 240
          default: 30
          description: The time budget. Routes are generated to fit it.
        max_routes:
          type: integer
          minimum: 1
          maximum: 6
          default: 4
        profile: { $ref: "#/components/schemas/ProfileInput" }
        preferences: { $ref: "#/components/schemas/Preferences" }
      anyOf:
        - required: [address]
        - required: [lat, lon]

    DerivedProfile:
      type: object
      description: What the API derived from the submitted profile.
      properties:
        sex: { type: string, enum: [male, female] }
        age_years: { type: integer }
        weight_kg: { type: number }
        weight_lb: { type: number }
        height_cm: { type: number }
        height_assumed:
          type: boolean
          description: |
            True when no height was supplied and a population mean was used.
            Surface this — a guessed height must not read as a known one.
        bmi: { type: number }
        bmi_class:
          type: string
          example: obesity class III
        body_fat_pct_est:
          type: number
          description: Deurenberg (1991) estimate. Population-level only.
        fat_free_mass_kg: { type: number }
        rmr_kcal_day:
          type: number
          description: Resting metabolic rate, Mifflin-St Jeor.
        baseline_speed_ms: { type: number }
        baseline_speed_mph: { type: number }
        step_length_m: { type: number }

    Effort:
      type: object
      description: The physiological cost of one walk.
      properties:
        distance_m: { type: number }
        distance_mi: { type: number }
        duration_s: { type: number }
        duration_min: { type: number }
        ascent_m: { type: number }
        descent_m: { type: number }
        ascent_ft: { type: number }
        descent_ft: { type: number }
        kcal_gross:
          type: number
          description: Including the calories you would burn at rest meanwhile.
        kcal_net:
          type: number
          description: The extra cost of the walk itself, above resting.
        steps: { type: integer }
        mets:
          type: number
          description: |
            Classic MET — kcal/hr per kg of body mass. Reported for
            comparability with fitness trackers.
        personal_mets:
          type: number
          description: |
            Expenditure as a multiple of *this person's* resting rate, which is
            what "how hard is this for me" actually means. Diverges from `mets`
            at high BMI, and is the more honest figure.
        intensity: { type: string, enum: [light, moderate, vigorous] }
        avg_speed_ms: { type: number }
        avg_speed_mph: { type: number }
        avg_pace_min_per_mi: { type: number }
        peak_grade_pct: { type: number }
        climb_per_km_m: { type: number }
        knee_load_peak_bw:
          type: number
          description: Peak knee compressive force, in multiples of body weight.

    Health:
      type: object
      description: |
        What the evidence supports about this walk, framed as progress toward
        published guidelines rather than as invented claims.
      properties:
        guideline_progress:
          type: object
          description: WHO 2020 — 150-300 min/week of moderate-intensity activity.
          properties:
            who_weekly_moderate_min: { type: integer, const: 150 }
            who_weekly_upper_min: { type: integer, const: 300 }
            moderate_minutes: { type: number }
            pct_of_weekly_target: { type: number }
            met_minutes: { type: number }
            counts_as_moderate:
              type: boolean
              description: False below 3 METs, where guideline credit cannot be claimed.
        steps:
          type: object
          description: |
            Ding et al., Lancet Public Health 2025 — benefits inflect around
            7,000 steps/day.
          properties:
            walk_steps: { type: integer }
            daily_target: { type: integer, const: 7000 }
            pct_of_daily_target: { type: number }
            context: { type: string }
        energy:
          type: object
          properties:
            kcal_gross: { type: number }
            kcal_net_of_resting: { type: number }
            note: { type: string }
        joint_load:
          type: object
          properties:
            peak_knee_force_bw: { type: number }
            peak_knee_force_kg: { type: number }
            peak_knee_force_lb: { type: number }
            note: { type: string }
        weight_projection:
          type: object
          description: |
            Projected body-weight change from repeating this walk.

            Short-run figures use the conventional 3,500 kcal per pound.
            Longer horizons use Hall et al. (Lancet, 2011), where a sustained
            10 kcal/day produces about 1 lb of eventual change — the static
            rule roughly doubles real one-year loss because it ignores the
            fall in metabolism as weight comes off.

            All figures are based on **net** calories (the cost above resting),
            and assume eating does not change. Appetite compensation is the
            largest reason real loss undershoots; it is listed in `caveats`.
          properties:
            projections:
              type: array
              items:
                type: object
                properties:
                  sessions_per_week: { type: integer, examples: [3, 5, 7] }
                  weekly_kcal: { type: number }
                  first_month_lb: { type: number }
                  one_year_lb: { type: number }
                  eventual_lb:
                    type: number
                    description: Where the projection settles, per Hall's model.
                  eventual_pct_of_body_weight: { type: number }
                  meaningful:
                    type: boolean
                    description: >
                      False when the weekly deficit is too small to project
                      honestly; clients should say so rather than show a number.
            basis: { type: string, const: net }
            note: { type: string }
            method: { type: string }
            caveats:
              type: array
              items: { type: string }
        caveats:
          type: array
          description: |
            The limits of these estimates. They travel with the numbers on
            purpose — an API consumer cannot take the figures without them.
          items: { type: string }

    Suitability:
      type: object
      description: |
        How well this route fits this walker. The score is never meaningful
        without its notes; display both.
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        notes:
          type: array
          items: { type: string }

    Destination:
      type: object
      properties:
        name: { type: string, example: Alta Plaza Park }
        category: { type: string, example: park }
        group:
          type: string
          enum: [green, scenic, culture, refuel, active]
        lat: { type: number }
        lon: { type: number }
        straight_line_m: { type: number }

    RouteGeometry:
      type: object
      description: |
        The full polyline, plus one run per surface class so the route can be
        drawn colour-coded by what you will be walking on.
      properties:
        type: { type: string, const: LineString }
        coordinates:
          type: array
          items:
            type: array
            items: { type: number }
            minItems: 2
            maxItems: 2
        segments:
          type: array
          items:
            type: object
            properties:
              surface:
                type: string
                enum: [path, sidewalk, crossing, road]
              coordinates:
                type: array
                items:
                  type: array
                  items: { type: number }

    Route:
      type: object
      properties:
        id: { type: integer }
        shape:
          type: string
          enum: [loop, out-and-back]
          description: |
            `out-and-back` means no distinct return exists — a genuine dead end
            or a peninsula — so the route retraces its outbound leg.
        score: { type: number }
        destination:
          oneOf:
            - $ref: "#/components/schemas/Destination"
            - type: "null"
        effort: { $ref: "#/components/schemas/Effort" }
        health: { $ref: "#/components/schemas/Health" }
        suitability: { $ref: "#/components/schemas/Suitability" }
        surface_breakdown_pct:
          type: object
          description: Percentage of the route's distance on each surface.
          additionalProperties: { type: number }
        surface_labels:
          type: object
          description: Display labels for each surface key.
          additionalProperties: { type: string }
        features:
          type: array
          description: Notable things on the route.
          items:
            type: string
            enum: [stairs, busy road, unpaved, bridge, tunnel, covered]
        streets:
          type: array
          maxItems: 25
          items: { type: string }
        geometry: { $ref: "#/components/schemas/RouteGeometry" }
        elevation_profile:
          type: array
          description: Cumulative distance against elevation, thinned for plotting.
          items:
            type: object
            properties:
              m: { type: number }
              ele: { type: number }

    Origin:
      type: object
      properties:
        lat: { type: number }
        lon: { type: number }
        snapped_lat: { type: number }
        snapped_lon: { type: number }
        snap_distance_m:
          type: number
          description: |
            How far the start moved to reach the nearest mapped walking network.
            Shown to the user rather than hidden.
        label: { type: string }
        match: { type: string }
        address: { type: object, additionalProperties: true }

    PlanResponse:
      type: object
      required: [region, origin, profile, routes]
      properties:
        region: { $ref: "#/components/schemas/RegionKey" }
        origin: { $ref: "#/components/schemas/Origin" }
        profile: { $ref: "#/components/schemas/DerivedProfile" }
        request:
          type: object
          description: The interpreted request, echoed back.
          properties:
            minutes: { type: number }
            preferences: { $ref: "#/components/schemas/Preferences" }
        routes:
          type: array
          description: Ranked best-first and de-duplicated by edge overlap.
          items: { $ref: "#/components/schemas/Route" }
        timing_ms:
          type: object
          properties:
            plan:
              type: number
              description: Server-side planning time, excluding cold-start load.
        attribution:
          type: string
          description: Required data attribution. Display this.
